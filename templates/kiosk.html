<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presence Tree</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="kiosk">
  <main id="scene" aria-label="Rotating point cloud memory tree"></main>
  <section class="intro">
    <h1>Presence Tree</h1>
    <p>Scan to hang a postcard.</p>
    <img src="/qr.png" alt="QR code to postcard upload page">
  </section>
  <button id="mailbox" class="mailbox" type="button" aria-label="Open archived postcards">
    <span aria-hidden="true">✉</span><b id="archive-count">0</b>
  </button>
  <p id="status" class="status">Connecting…</p>
  <noscript><p class="fatal">JavaScript is disabled. Enable JavaScript for localhost to display the tree.</p></noscript>
  <dialog id="viewer">
    <button class="close" type="button" aria-label="Close">×</button>
    <img alt="Enlarged postcard">
  </dialog>
  <dialog id="archive">
    <button class="close" type="button" aria-label="Close">×</button>
    <h2>Mailbox</h2>
    <p class="empty">Archived postcards will appear here after the tree holds 20.</p>
    <div class="archive-grid"></div>
  </dialog>
  <script>
    window.addEventListener('error', function (event) {
      document.querySelector('#status').textContent = 'Display error: ' + (event.message || 'JavaScript could not start');
    });
    window.addEventListener('unhandledrejection', function () {
      document.querySelector('#status').textContent = 'Display error: a browser feature could not start';
    });
  </script>
  <script src="/static/kiosk.js"></script>
</body>
</html>
